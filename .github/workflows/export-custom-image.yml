name: Export custom New API image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to export
        required: true
        default: channel-affinity-528d8cb5f515
        type: string

permissions:
  contents: read
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.image_tag }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export image archive
        run: docker pull "$IMAGE" && docker save "$IMAGE" | gzip -1 > new-api-custom-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: new-api-custom-image
          path: new-api-custom-image.tar.gz
          if-no-files-found: error
