name: Transfer custom New API image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to transfer
        required: true
        default: channel-affinity-528d8cb5f515
        type: string

permissions:
  contents: read
  packages: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.image_tag }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Save compressed image archive
        run: docker pull "$IMAGE" && docker save "$IMAGE" | gzip -1 > /tmp/new-api-custom-image.tar.gz

      - name: Install SSH transfer client
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Transfer image archive
        env:
          SSHPASS: ${{ secrets.NEW_API_SERVER_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 124.223.95.142 >> ~/.ssh/known_hosts
          sshpass -e scp /tmp/new-api-custom-image.tar.gz root@124.223.95.142:/opt/new-api-deploy/new-api-custom-image.tar.gz
